name: Deploy Blockchain App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            PROJECT_DIR="$HOME/Blockchain-new-main-main/Blockchain-new-main-main"

            cd "$PROJECT_DIR"

            OLD_COMMIT=$(git rev-parse HEAD)

            git fetch origin main

            NEW_COMMIT=$(git rev-parse origin/main)

            if [ "$OLD_COMMIT" = "$NEW_COMMIT" ]; then
              echo "No new changes."
              exit 0
            fi

            CHANGED_FILES=$(git diff --name-only "$OLD_COMMIT" "$NEW_COMMIT")

            PACKAGE_CHANGED=false
            FRONTEND_CHANGED=false
            BACKEND_CHANGED=false
            CONTRACT_CHANGED=false

            if echo "$CHANGED_FILES" | grep -Eq '^(package.json|package-lock.json)$'; then
              PACKAGE_CHANGED=true
            fi

            if echo "$CHANGED_FILES" | grep -q '^frontend/'; then
              FRONTEND_CHANGED=true
            fi

            if echo "$CHANGED_FILES" | grep -q '^backend/'; then
              BACKEND_CHANGED=true
            fi

            if echo "$CHANGED_FILES" | grep -Eq '^(contracts/|hardhat.config.js|scripts/|ignition/)'; then
              CONTRACT_CHANGED=true
            fi

            git pull --ff-only origin main

            if [ "$PACKAGE_CHANGED" = true ]; then
              npm install
              BACKEND_CHANGED=true
            fi

            if [ "$CONTRACT_CHANGED" = true ]; then
              npx hardhat compile
              BACKEND_CHANGED=true
              echo "Hardhat node NOT restarted"
              echo "Contract NOT redeployed automatically"
            fi

            if [ "$BACKEND_CHANGED" = true ]; then
              pm2 restart blockchain-backend --update-env
              pm2 save
            fi

            if [ "$FRONTEND_CHANGED" = true ]; then
              sudo rm -rf /var/www/html/*
              sudo cp -r frontend/* /var/www/html/

              sudo chown -R www-data:www-data /var/www/html
              sudo find /var/www/html -type d -exec chmod 755 {} \;
              sudo find /var/www/html -type f -exec chmod 644 {} \;

              sudo nginx -t
              sudo systemctl reload nginx
            fi

            echo "Deployment completed"
            pm2 status
